<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="webstyles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SpotiCustom</title>
  </head>
  <body>
    <div class="menu">
      <h1><a href="./success.html" id="maintitle">SpotiCustom</a></h1>
      <img src="menu.png" alt="Menu" id="menu-icon" onclick="showMenu()" />
      <div class="menu-box" id="menubox">
        <div class="menu-links">
          <a href="./aboutMe.html">About My Profile</a>
          <a href="./forMe.html">For Me</a>
          <a onclick="logOut()" style="cursor: pointer">Log Out</a>
        </div>
      </div>
    </div>

    <h1 style="text-align: center">Personally Made For You</h1>
    <br />
    <div class="center">
      <h3>Our Song Recommendations Based on Your Top 5 Artists</h3>
      <div id="widgetContainer3" class="widget"></div>
    </div>
    <div class="center">
      <h3>Artists You Should Check Out</h3>
      <div id="widgetContainer4" class="widget"></div>
    </div>
    <script src="./apiCall.js" type="text/javascript"></script>
    <script>
      getTrackRec();
      getArtistRec();
    </script>
    <script>
      let menu = document.getElementById("menubox");
      let menuicon = document.getElementById("menu-icon");
      let open = true;

      function showMenu() {
        if (open) {
          menu.style.visibility = "visible";
          menuicon.src = "close.png";
        } else {
          menu.style.visibility = "hidden";
          menuicon.src = "menu.png";
        }
        open = !open;
      }
    </script>
  </body>
</html>
