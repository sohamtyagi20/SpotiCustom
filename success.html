<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="webstyles.css" />
    <title>Global chart — SpotiCustom</title>
  </head>
  <body>
    <header class="app-bar">
      <div class="app-bar-inner">
        <a class="brand" href="/" aria-label="SpotiCustom home">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span>SpotiCustom</span>
        </a>
        <nav class="desktop-nav" aria-label="Primary navigation">
          <a href="./success.html" aria-current="page">Global chart</a>
          <a href="./aboutMe.html">Listening profile</a>
          <a href="./forMe.html">For you</a>
        </nav>
        <button class="menu-button" type="button" data-menu-button aria-expanded="false" aria-controls="mobile-menu">Menu</button>
        <div class="mobile-menu" id="mobile-menu" data-menu hidden>
          <a href="./success.html" aria-current="page">Global chart</a>
          <a href="./aboutMe.html">Listening profile</a>
          <a href="./forMe.html">For you</a>
          <button type="button" onclick="logOut()">Log out</button>
        </div>
        <button class="logout-action" type="button" onclick="logOut()">Log out</button>
      </div>
    </header>

    <main class="app-canvas">
      <header class="title-row">
        <div>
          <h1>Global chart</h1>
          <p>The songs listeners around the world are playing now.</p>
        </div>
        <span class="live-status"><span class="status-dot" aria-hidden="true"></span>Spotify Top 50</span>
      </header>

      <section class="feature-panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-heading">
          <div>
            <h2 id="chart-title">Today’s most-played tracks</h2>
            <p>Updated by Spotify throughout the day.</p>
          </div>
          <a href="https://open.spotify.com/playlist/37i9dQZEVXbMDoHDwVN2tF" target="_blank" rel="noreferrer">Open playlist</a>
        </div>
        <div class="spotify-frame">
          <iframe title="Spotify Top 50 Global playlist" src="https://open.spotify.com/embed/playlist/37i9dQZEVXbMDoHDwVN2tF" width="100%" height="700" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
        </div>
      </section>
    </main>
    <script src="./apiCall.js"></script>
    <script src="./ui.js"></script>
  </body>
</html>
